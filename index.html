                cat.items.forEach(p => {
                    allProducts.push(p); 
                    const optionsHTML = p.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                    catalogDiv.innerHTML += `
                        <div class="product-card">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price.toFixed(2)} BYN</div>
                            <select id="option-${p.id}">${optionsHTML}</select>
                            <button class="btn-add" onclick="addToCart(${p.id})">Добавить в корзину</button>
                        </div>
                    `;
                });
            });
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            const selectedOption = document.getElementById(`option-${productId}`).value;

            const existingItem = cart.find(item => item.id === productId && item.option === selectedOption);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, option: selectedOption, quantity: 1 });
            }
            updateCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function updateCart() {
            const cartList = document.getElementById('cartList');
            const totalPriceEl = document.getElementById('totalPrice');
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p style="text-align: center; color: #888;">Корзина пуста</p>';
                totalPriceEl.textContent = "0.00";
                tg.MainButton.hide();
                return;
            }

            cartList.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                cartList.innerHTML += `
                    <div class="cart-item">
                        <div><b>${item.name}</b> (${item.option})<br>${item.quantity} шт. × ${item.price.toFixed(2)} BYN</div>
                        <div><b>${itemTotal.toFixed(2)} BYN</b><span class="cart-item-remove" onclick="removeFromCart(${index})">✕</span></div>
                    </div>
                `;
            });

            totalPriceEl.textContent = total.toFixed(2);
            tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ (${total.toFixed(2)} BYN)`);
            tg.MainButton.show();
        }

        function handleDeliveryChange() {
            const station = document.getElementById('stationSelect').value;
            const commentLabel = document.getElementById('commentLabel');
            const commentInput = document.getElementById('commentInput');
            const deliveryNote = document.getElementById('deliveryNote');

            if (station === 'Доставка') {
                commentLabel.textContent = '📍 Укажите адрес доставки:';
                commentInput.placeholder = 'Улица, дом, квартира...';
                deliveryNote.style.display = 'block';
            } else {
                commentLabel.textContent = '💬 Комментарий к заказу:';
                commentInput.placeholder = 'Ваши пожелания...';
                deliveryNote.style.display = 'none';
            }
        }

        tg.MainButton.onClick(() => {
            const station = document.getElementById('stationSelect').value;
            const comment = document.getElementById('commentInput').value.trim();

            if (station === 'Доставка' && !comment) {
                alert('Пожалуйста, укажите адрес доставки!');
                return;
            }

            let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const data = {
                station: station,
                comment: comment || "Отсутствует",
                items: cart,
                total_price: total.toFixed(2)
            };

            tg.sendData(JSON.stringify(data));
        });

        renderCatalog();
    </script>
</body>
</html>
